name: Refresh decision data

# Separate from CI. It does not run on pull requests.
# Run it by hand after a race weekend. A failed refresh does not fail the CI workflow.
on:
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Download public FIA documents
        run: python -m f1_penalty_decoder.ingest
        env:
          PYTHONPATH: src
      - name: Re-check parser and golden examples
        run: pytest -q
