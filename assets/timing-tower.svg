<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
  <rect width="960" height="560" fill="#09090b"/>
  <text x="48" y="64" fill="#E10600" font-family="Titillium Web, Arial Narrow, sans-serif" font-size="16" font-weight="700" letter-spacing="4">UNOFFICIAL FAN TOOL</text>
  <text x="48" y="108" fill="#f4f4f5" font-family="Titillium Web, Arial Narrow, sans-serif" font-size="40" font-weight="700">PENALTY DECODER</text>
  <text x="48" y="146" fill="#a1a1aa" font-family="Titillium Web, Arial Narrow, sans-serif" font-size="18">Layout sample only. Names and penalties in the rows below are not a real stewards' decision.</text>
  <g font-family="Titillium Web, Arial Narrow, sans-serif">
    <rect x="48" y="190" width="864" height="78" rx="14" fill="#141417" stroke="#2a2a30"/>
    <rect x="48" y="190" width="8" height="78" rx="4" fill="#3671C6"/>
    <text x="80" y="228" fill="#f4f4f5" font-size="28" font-weight="700">VER</text>
    <text x="160" y="222" fill="#f4f4f5" font-size="18">Leaving the track and gaining an advantage</text>
    <text x="160" y="246" fill="#a1a1aa" font-size="14">Race · Article 33.3 · 2025 Sporting Regulations</text>
    <rect x="790" y="210" width="92" height="36" rx="18" fill="#E10600"/>
    <text x="812" y="234" fill="#ffffff" font-size="14" font-weight="700">TIME</text>
    <rect x="48" y="284" width="864" height="78" rx="14" fill="#141417" stroke="#2a2a30"/>
    <rect x="48" y="284" width="8" height="78" rx="4" fill="#64C4FF"/>
    <text x="80" y="322" fill="#f4f4f5" font-size="28" font-weight="700">SAI</text>
    <text x="160" y="316" fill="#f4f4f5" font-size="18">Unnecessarily impeded another car</text>
    <text x="160" y="340" fill="#a1a1aa" font-size="14">Qualifying · Article 37.5</text>
    <rect x="790" y="304" width="92" height="36" rx="18" fill="#E10600"/>
    <text x="814" y="328" fill="#ffffff" font-size="14" font-weight="700">GRID</text>
    <rect x="48" y="378" width="420" height="130" rx="16" fill="#141417" stroke="#2a2a30"/>
    <text x="72" y="414" fill="#f4f4f5" font-size="16" font-weight="700">THE RULE</text>
    <text x="72" y="444" fill="#d4d4d8" font-size="15">Quoted from the year's regulation file.</text>
    <text x="72" y="468" fill="#d4d4d8" font-size="15">If the article is missing: I don't know.</text>
    <rect x="492" y="378" width="420" height="130" rx="16" fill="#141417" stroke="#2a2a30"/>
    <text x="516" y="414" fill="#f4f4f5" font-size="16" font-weight="700">BEFORE THIS</text>
    <text x="516" y="444" fill="#d4d4d8" font-size="15">Counts are rows in the local file.</text>
    <text x="516" y="468" fill="#d4d4d8" font-size="15">Each example links to the FIA PDF.</text>
  </g>
</svg>
